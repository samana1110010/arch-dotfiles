amily:"Share Tech Mono",monospace;padding:16px;height:100vh;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:thin;scrollbar-color:#cba6f730 transparent;}
#sidebar::-webkit-scrollbar{width:4px;}
#sidebar::-webkit-scrollbar-thumb{background:#cba6f730;border-radius:2px;}
canvas#bg{position:fixed;top:0;left:0;width:380px;height:100vh;opacity:0.15;pointer-events:none;z-index:0;}
.content{position:relative;z-index:1;display:flex;flex-direction:column;gap:10px;}
.glitch-text{position:relative;display:inline-block;color:#cba6f7;}
.glitch-text::before,.glitch-text::after{content:attr(data-text);position:absolute;top:0;left:0;width:100%;overflow:hidden;}
.glitch-text::before{color:#89b4fa;animation:glitch1 3s infinite;clip-path:polygon(0 30%,100% 30%,100% 50%,0 50%);}
.glitch-text::after{color:#f38ba8;animation:glitch2 3s infinite;clip-path:polygon(0 60%,100% 60%,100% 75%,0 75%);}
@keyframes glitch1{0%,90%,100%{transform:translate(0)}92%{transform:translate(-3px,1px)}94%{transform:translate(3px,-1px)}96%{transform:translate(-2px,0)}}
@keyframes glitch2{0%,88%,100%{transform:translate(0)}90%{transform:translate(3px,2px)}93%{transform:translate(-2px,-1px)}95%{transform:translate(2px,0)}}
.panel{border:1px solid #cba6f720;border-radius:8px;padding:12px 14px;background:rgba(10,5,20,0.78);position:relative;overflow:hidden;backdrop-filter:blur(10px);}
.panel::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#cba6f7,transparent);animation:scan 4s linear infinite;}
@keyframes scan{0%{opacity:0.3}50%{opacity:1}100%{opacity:0.3}}
.stat-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;}
.stat{text-align:center;padding:8px 4px;}
.stat-label{font-size:10px;color:#6e5f8a;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:4px;}
.stat-value{font-size:13px;font-weight:500;}
.stat-value.blue{color:#89b4fa;text-shadow:0 0 8px #89b4fa80;}
.stat-value.green{color:#a6e3a1;text-shadow:0 0 8px #a6e3a180;}
.stat-value.pink{color:#f5c2e7;text-shadow:0 0 8px #f5c2e780;}
.panel-title{font-size:10px;letter-spacing:0.2em;color:#6e5f8a;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.panel-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#cba6f730,transparent);}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.cal-month{font-size:13px;color:#cba6f7;letter-spacing:0.1em;}
.cal-nav{background:none;border:1px solid #cba6f730;border-radius:4px;width:24px;height:24px;cursor:pointer;font-size:16px;color:#cba6f7;display:flex;align-items:center;justify-content:center;font-family:inherit;}
.cal-nav:hover{border-color:#cba6f7;background:#cba6f710;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.day-name{font-size:10px;color:#6e5f8a;text-align:center;padding:3px 0;}
.cal-day{font-size:11px;text-align:center;padding:5px 2px;border-radius:4px;cursor:pointer;color:#9d8fbb;position:relative;}
.cal-day:hover{background:#cba6f715;color:#e0d7ff;}
.cal-day.today{background:#cba6f7;color:#1e1e2e;font-weight:500;box-shadow:0 0 8px #cba6f780;}
.cal-day.other{color:#3a2f50;}
.cal-day.has-task::after{content:"";position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:#89b4fa;box-shadow:0 0 4px #89b4fa;}
.cal-day.has-done::after{background:#a6e3a1;box-shadow:0 0 4px #a6e3a1;}
.cal-day.selected{border:1px solid #cba6f7;}
.add-row{display:flex;gap:6px;margin-bottom:8px;}
.add-row input{flex:1;font-size:12px;padding:7px 10px;border:1px solid #cba6f730;border-radius:6px;background:rgba(13,10,26,0.8);color:#e0d7ff;outline:none;font-family:"Share Tech Mono",monospace;}
.add-row input:focus{border-color:#cba6f7;box-shadow:0 0 8px #cba6f730;}
.add-row input::placeholder{color:#3a2f50;}
.add-btn{background:#cba6f7;color:#1e1e2e;border:none;border-radius:6px;padding:7px 12px;font-size:12px;font-weight:500;cursor:pointer;font-family:"Share Tech Mono",monospace;box-shadow:0 0 10px #cba6f760;}
.add-btn:hover{background:#d8bfff;}
.todo-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #cba6f710;}
.todo-item:last-child{border-bottom:none;}
.check-btn{width:16px;height:16px;border-radius:50%;border:1.5px solid #cba6f7;background:none;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 0 4px #cba6f740;}
.check-btn.done{background:#cba6f7;box-shadow:0 0 8px #cba6f7;}
.check-btn.done::after{content:"";display:block;width:4px;height:7px;border:1.5px solid #1e1e2e;border-top:none;border-left:none;transform:rotate(45deg) translateY(-1px);}
.todo-text{flex:1;font-size:12px;color:#c0b0e0;}
.todo-text.done{text-decoration:line-through;color:#3a2f50;}
.del-btn{background:none;border:none;cursor:pointer;font-size:14px;color:#3a2f50;padding:0 2px;font-family:inherit;}
.del-btn:hover{color:#f38ba8;}
.done-label{font-size:10px;color:#3a2f50;letter-spacing:0.1em;padding:6px 0 2px;text-transform:uppercase;}
.divider{height:1px;background:linear-gradient(90deg,transparent,#cba6f720,transparent);margin:6px 0;}
.scanline{position:absolute;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);pointer-events:none;z-index:2;border-radius:8px;}
.day-detail{font-size:11px;color:#6e5f8a;margin-top:6px;padding:6px 0;border-top:1px solid #cba6f720;}
.day-detail-title{color:#cba6f7;font-size:10px;letter-spacing:0.1em;margin-bottom:4px;}
.music-panel{display:flex;flex-direction:column;gap:8px;}
.music-info{display:flex;flex-direction:column;gap:2px;}
.music-title{font-size:13px;color:#e0d7ff;}
.music-artist{font-size:11px;color:#6e5f8a;}
.music-controls{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:4px;}
.music-btn{background:none;border:1px solid #cba6f730;border-radius:4px;width:28px;height:28px;cursor:pointer;font-size:14px;color:#cba6f7;display:flex;align-items:center;justify-content:center;font-family:inherit;}
.music-btn:hover{border-color:#cba6f7;background:#cba6f710;}
.music-btn.play{background:#cba6f720;border-color:#cba6f7;width:36px;height:36px;border-radius:50%;font-size:16px;}
.progress-bar{height:2px;background:#cba6f720;border-radius:1px;margin-top:4px;}
.progress-fill{height:100%;background:#cba6f7;border-radius:1px;width:0%;transition:width 1s linear;}
.no-music{font-size:11px;color:#3a2f50;text-align:center;padding:8px 0;}
</style>
</head>
<body>
<div id="sidebar">
  <canvas id="bg"></canvas>
  <div class="content">
    <div style="padding:4px 0 8px;text-align:center;">
      <div style="font-size:32px;font-weight:500;letter-spacing:0.15em;" class="glitch-text" id="big-time" data-text="00:00">00:00</div>
      <div style="font-size:11px;color:#6e5f8a;letter-spacing:0.2em;margin-top:4px;" id="big-date">--- -- ----</div>
    </div>

    <div class="panel"><div class="scanline"></div>
      <div class="stat-row">
        <div class="stat"><div class="stat-label">battery</div><div class="stat-value blue" id="bat">---%</div></div>
        <div class="stat"><div class="stat-label">status</div><div class="stat-value green" id="bat-status">---</div></div>
        <div class="stat"><div class="stat-label">network</div><div class="stat-value green" id="net-val">online</div></div>
        <div class="stat"><div class="stat-label">type</div><div class="stat-value pink" id="net-type">---</div></div>
      </div>
    </div>

    <div class="panel"><div class="scanline"></div>
      <div class="panel-title">now playing</div>
      <div class="music-panel" id="music-panel">
        <div class="no-music" id="no-music">// no media playing</div>
        <div id="music-content" style="display:none;">
          <div class="music-info">
            <div class="music-title" id="music-title">---</div>
            <div class="music-artist" id="music-artist">---</div>
          </div>
          <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
          <div class="music-controls">
            <button class="music-btn" id="prev-btn">&#8249;</button>
            <button class="music-btn play" id="play-btn">&#9654;</button>
            <button class="music-btn" id="next-btn">&#8250;</button>
          </div>
        </div>
      </div>
    </div>

    <div class="panel"><div class="scanline"></div>
      <div class="panel-title">calendar</div>
      <div class="cal-header">
        <button class="cal-nav" id="prev">&#8249;</button>
        <span class="cal-month" id="cal-title"></span>
        <button class="cal-nav" id="next">&#8250;</button>
      </div>
      <div class="cal-grid">
        <div class="day-name">Su</div><div class="day-name">Mo</div><div class="day-name">Tu</div>
        <div class="day-name">We</div><div class="day-name">Th</div><div class="day-name">Fr</div><div class="day-name">Sa</div>
      </div>
      <div class="cal-grid" id="cal-days"></div>
      <div id="day-detail" style="display:none;" class="day-detail">
        <div class="day-detail-title" id="detail-date"></div>
        <div id="detail-tasks"></div>
      </div>
    </div>

    <div class="panel"><div class="scanline"></div>
      <div class="panel-title">missions</div>
      <div class="add-row">
        <input type="text" id="new-task" placeholder="> add new mission..." />
        <button class="add-btn" id="add-btn">+ add</button>
      </div>
      <div id="todo-list"></div>
      <div id="done-section"></div>
    </div>
  </div>
</div>
<script>
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
let vY,vM,selectedDay=null;
let tasks=[];
try{tasks=JSON.parse(localStorage.getItem("arcane-tasks")||"[]");}catch(e){}
function save(){try{localStorage.setItem("arcane-tasks",JSON.stringify(tasks));}catch(e){}}

const canvas=document.getElementById("bg");
const ctx=canvas.getContext("2d");
let particles=[];
function initCanvas(){canvas.width=380;canvas.height=window.innerHeight;particles=Array.from({length:60},()=>{return{x:Math.random()*380,y:Math.random()*canvas.height,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,r:Math.random()*1.5+0.5,color:Math.random()>0.5?"#cba6f7":"#89b4fa",life:Math.random()*Math.PI*2};});}
function animBg(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life+=0.008;if(p.x<0||p.x>canvas.width)p.vx*=-1;if(p.y<0||p.y>canvas.height)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.color;ctx.globalAlpha=0.3+0.3*Math.sin(p.life);ctx.fill();});ctx.globalAlpha=1;requestAnimationFrame(animBg);}
initCanvas();animBg();window.addEventListener("resize",initCanvas);

function updateClock(){const now=new Date();const h=now.getHours(),m=now.getMinutes();const ampm=h>=12?"pm":"am";const hh=h%12||12;const timeStr=hh+":"+String(m).padStart(2,"0")+" "+ampm;const el=document.getElementById("big-time");el.textContent=timeStr;el.setAttribute("data-text",timeStr);document.getElementById("big-date").textContent=DAYS[now.getDay()]+" // "+MONTHS[now.getMonth()]+" "+now.getDate()+" // "+now.getFullYear();}

function updateBattery(){if(navigator.getBattery){navigator.getBattery().then(b=>{document.getElementById("bat").textContent=Math.round(b.level*100)+"%";document.getElementById("bat-status").textContent=b.charging?"charging":"on bat";document.getElementById("bat-status").style.color=b.charging?"#a6e3a1":"#f9e2af";}).catch(()=>{document.getElementById("bat").textContent="N/A";});}else{document.getElementById("bat").textContent="N/A";}const conn=navigator.connection||navigator.mozConnection||navigator.webkitConnection;document.getElementById("net-val").textContent=navigator.onLine?"online":"offline";document.getElementById("net-val").style.color=navigator.onLine?"#a6e3a1":"#f38ba8";if(conn){document.getElementById("net-type").textContent=conn.effectiveType||conn.type||"wifi";}else{document.getElementById("net-type").textContent="wifi";}}

function updateMusic(){if(!navigator.mediaSession)return;const meta=navigator.mediaSession.metadata;if(meta&&meta.title){document.getElementById("no-music").style.display="none";document.getElementById("music-content").style.display="block";document.getElementById("music-title").textContent=meta.title||"Unknown";document.getElementById("music-artist").textContent=meta.artist||"Unknown artist";const state=navigator.mediaSession.playbackState;document.getElementById("play-btn").innerHTML=state==="playing"?"&#9646;&#9646;":"&#9654;";}else{document.getElementById("no-music").style.display="block";document.getElementById("music-content").style.display="none";}}

document.getElementById("play-btn").onclick=()=>{if(navigator.mediaSession){const state=navigator.mediaSession.playbackState;if(state==="playing"){navigator.mediaSession.pause&&navigator.mediaSession.pause();}else{navigator.mediaSession.play&&navigator.mediaSession.play();}}updateMusic();};
document.getElementById("prev-btn").onclick=()=>{navigator.mediaSession&&navigator.mediaSession.previoustrack&&navigator.mediaSession.previoustrack();setTimeout(updateMusic,500);};
document.getElementById("next-btn").onclick=()=>{navigator.mediaSession&&navigator.mediaSession.nexttrack&&navigator.mediaSession.nexttrack();setTimeout(updateMusic,500);};

function renderCal(){const now=new Date();const today=now.getDate(),tm=now.getMonth(),ty=now.getFullYear();document.getElementById("cal-title").textContent=MONTHS[vM]+" "+vY;const first=new Date(vY,vM,1).getDay();const dim=new Date(vY,vM+1,0).getDate();const prevDim=new Date(vY,vM,0).getDate();
const activeDays=new Set(tasks.filter(t=>!t.done&&t.date).filter(t=>{const d=new Date(t.date);return d.getFullYear()===vY&&d.getMonth()===vM;}).map(t=>new Date(t.date).getDate()));
const doneDays=new Set(tasks.filter(t=>t.done&&t.doneDate).filter(t=>{const d=new Date(t.doneDate);return d.getFullYear()===vY&&d.getMonth()===vM;}).map(t=>new Date(t.doneDate).getDate()));
let html="";for(let i=0;i<first;i++)html+=`<div class="cal-day other">${prevDim-first+1+i}</div>`;
for(let d=1;d<=dim;d++){const isT=d===today&&vM===tm&&vY===ty;const hasA=activeDays.has(d);const hasD=doneDays.has(d);const isSel=selectedDay===d&&vM===tm&&vY===ty;html+=`<div class="cal-day${isT?" today":""}${hasD?" has-done":hasA?" has-task":""}${isSel?" selected":""}" onclick="selectDay(${d})">${d}</div>`;}
const rem=42-first-dim;for(let i=1;i<=rem;i++)html+=`<div class="cal-day other">${i}</div>`;
document.getElementById("cal-days").innerHTML=html;}

window.selectDay=function(d){const now=new Date();selectedDay=d;const dateKey=`${vY}-${String(vM+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;const dayTasks=tasks.filter(t=>{if(t.done&&t.doneDate){const dd=new Date(t.doneDate);return dd.getFullYear()===vY&&dd.getMonth()===vM&&dd.getDate()===d;}if(!t.done&&t.date){const dd=new Date(t.date);return dd.getFullYear()===vY&&dd.getMonth()===vM&&dd.getDate()===d;}return false;});
const detail=document.getElementById("day-detail");const detailTasks=document.getElementById("detail-tasks");document.getElementById("detail-date").textContent=MONTHS[vM]+" "+d+" "+vY;
if(dayTasks.length===0){detailTasks.innerHTML='<div style="font-size:11px;color:#3a2f50;">// nothing here</div>';}else{detailTasks.innerHTML=dayTasks.map(t=>`<div style="font-size:11px;padding:2px 0;color:${t.done?"#a6e3a1":"#c0b0e0"};">${t.done?"✓":"○"} ${t.text}</div>`).join("");}
detail.style.display="block";renderCal();};

function renderTasks(){const active=tasks.filter(t=>!t.done);const done=tasks.filter(t=>t.done);let html="";if(!active.length)html='<div style="font-size:11px;color:#3a2f50;padding:6px 0;">// no active missions</div>';active.forEach(t=>{html+=`<div class="todo-item"><button class="check-btn" onclick="toggle(${t.id})"></button><span class="todo-text">${t.text}</span><button class="del-btn" onclick="del(${t.id})">x</button></div>`;});document.getElementById("todo-list").innerHTML=html;let dhtml="";if(done.length){dhtml='<div class="divider"></div><div class="done-label">// completed</div>';done.forEach(t=>{dhtml+=`<div class="todo-item"><button class="check-btn done" onclick="toggle(${t.id})"></button><span class="todo-text done">${t.text}</span><button class="del-btn" onclick="del(${t.id})">x</button></div>`;});}document.getElementById("done-section").innerHTML=dhtml;}

window.toggle=id=>{tasks=tasks.map(t=>t.id===id?{...t,done:!t.done,doneDate:!t.done?new Date().toISOString():null}:t);save();renderTasks();renderCal();};
window.del=id=>{tasks=tasks.filter(t=>t.id!==id);save();renderTasks();renderCal();};
function addTask(){const inp=document.getElementById("new-task");const text=inp.value.trim();if(!text)return;tasks.push({id:Date.now(),text,done:false,date:new Date().toISOString(),doneDate:null});inp.value="";save();renderTasks();renderCal();}
document.getElementById("add-btn").onclick=addTask;
document.getElementById("new-task").addEventListener("keydown",e=>{if(e.key==="Enter")addTask();});
document.getElementById("prev").onclick=()=>{vM--;if(vM<0){vM=11;vY--;}selectedDay=null;document.getElementById("day-detail").style.display="none";renderCal();};
document.getElementById("next").onclick=()=>{vM++;if(vM>11){vM=0;vY++;}selectedDay=null;document.getElementById("day-detail").style.display="none";renderCal();};
const now=new Date();vY=now.getFullYear();vM=now.getMonth();
updateClock();updateBattery();updateMusic();renderCal();renderTasks();
setInterval(updateClock,10000);setInterval(updateBattery,60000);setInterval(updateMusic,3000);
</script>
</body>
</html>
