# --- THE SHELL FIX ---
# This ensures Kitty ALWAYS opens Zsh immediately
shell zsh
include colors.conf
# --- FONT (Dev Focused) ---
font_family      FiraCode Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures never

# --- THE "FROSTED GLASS" LOOK ---
background_opacity         0.7
background_blur            0
dynamic_background_opacity yes
window_padding_width       25
confirm_os_window_close    0

# --- CURSOR (The "Cool" Part) ---
# This makes the cursor a purple glowing block with a trail
cursor            #cba6f7
cursor_text_color #11111b
cursor_shape      block
cursor_trail      3
cursor_trail_decay 0.1 0.4

# --- TAB BAR (For Multitasking) ---
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cba6f7
inactive_tab_background #1e1e2e

# --- ARCANE COLORS (Catppuccin Mocha Base) ---
foreground              #cdd6f4
#background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #f5e0dc

# Purple/Blue Borders for that "Sick" look
active_border_color     #cba6f7
inactive_border_color   #89b4fa

# Terminal Colors (Purple/Blue/Pink)
color0 #45475a
color8 #585b70
color1 #f38ba8
color9 #f38ba8
color2 #a6e3a1
color10 #a6e3a1
color3 #f9e2af
color11 #f9e2af
color4 #89b4fa
color12 #89b4fa
color5 #cba6f7
color13 #cba6f7
color6 #94e2d5
color14 #94e2d5
color7 #bac2de
color15 #a6adc8

